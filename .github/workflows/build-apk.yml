name: Build Memoir Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Generate Android project and sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Memoir app icon to Android mipmaps
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
            for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              dir="android/app/src/main/res/mipmap-$dpi"
              if [ -d "$dir" ]; then
                cp public/pwa-512x512.png "$dir/ic_launcher.png"
                cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
              fi
            done
          fi

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and upload APK artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Memoir.apk

      - name: Upload Memoir.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memoir-Android-APK
          path: release-apk/Memoir.apk
          retention-days: 30
