    <script>
      (function () {
        try {
          var t = localStorage.getItem('chromanote_theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
